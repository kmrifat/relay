name: checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The packages are pure Dart (plus the small relay-pty C helper), so they
  # run on Linux, which costs a tenth of macOS minutes on private repos.
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: SQLite for relay_core, git identity for the daemon tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
          git config --global user.email ci@example.com
          git config --global user.name CI
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      # The team Worker on Miniflare, for relay_sync's and relayd's Worker tests.
      - run: npm ci --prefix worker
      - run: flutter pub get
      - run: tool/build_pty.sh
      - name: Worker tests
        run: npm test --prefix worker
      - name: Analyze and test each package
        run: |
          for p in packages/*; do
            echo "::group::$p"
            (cd "$p" && dart analyze --fatal-infos && dart test) || exit 1
            echo "::endgroup::"
          done

  # Analyzer and widget tests don't need a Mac either.
  app-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: cd apps/relay && flutter analyze && flutter test

  # Windows (M10): relayd, ConPTY terminals and the packages' tests, then the
  # Windows app. windows-2022 carries mingw-w64's gcc for relay-pty.exe.
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: sqlite3.dll for relayd and its tests (pinned, checked)
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.sqlite.org/2025/sqlite-dll-win-x64-3500400.zip -OutFile sqlite.zip
          $hash = (Get-FileHash sqlite.zip -Algorithm SHA256).Hash
          if ($hash -ne '56B8751CDBF6DCD8AC9A35508039E456692A402BC5DDF576C2B0EDDB0FED8536') { throw "sqlite3.dll zip hash mismatch: $hash" }
          New-Item -ItemType Directory -Force tool/out | Out-Null
          Expand-Archive sqlite.zip -DestinationPath tool/out -Force
          "$pwd\tool\out" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: git identity, no CRLF rewriting
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global core.autocrlf false
      - run: flutter pub get
      - run: tool/build_pty.sh
      - name: Package tests (every package runs; the step fails at the end)
        run: |
          failed=()
          for p in relay_core relay_protocol relay_agents relay_git relay_pty relay_sync relay_daemon; do
            echo "::group::$p"
            (cd "packages/$p" && dart test) || failed+=("$p")
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then echo "::error::failed: ${failed[*]}"; exit 1; fi
      - name: Windows app with relayd in helpers/
        run: |
          tool/build_relay_helper.sh tool/out
          cd apps/relay && flutter build windows --release
      - name: The bundle carries relayd, the ConPTY helper and SQLite
        run: |
          r=apps/relay/build/windows/x64/runner/Release
          test -f $r/relay.exe && test -f $r/helpers/relay.exe && test -f $r/helpers/relay-pty.exe && test -f $r/helpers/sqlite3.dll
      - name: Installer
        run: '"/c/Program Files (x86)/Inno Setup 6/ISCC.exe" tool/release/windows_installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: relay-windows-x64
          path: |
            apps/relay/build/windows/x64/runner/Release
            tool/release/relay-windows-x64-setup.exe

  # The Linux desktop app (M10), with relayd and relay-pty in helpers/.
  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GTK and toolchain for Flutter on Linux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev libstdc++-12-dev zsync
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: tool/build_relay_helper.sh tool/out
      - run: cd apps/relay && flutter build linux --release
      - name: The bundle carries relayd
        run: test -x apps/relay/build/linux/x64/release/bundle/helpers/relay && test -x apps/relay/build/linux/x64/release/bundle/helpers/relay-pty
      - name: AppImage
        working-directory: apps/relay
        run: ../../tool/release/linux_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: relay-linux-x64
          path: |
            apps/relay/build/linux/x64/release/bundle
            apps/relay/relay-linux-x64.AppImage

  # Only the macOS build itself runs on a Mac, and only once the cheaper
  # jobs pass.
  macos-build:
    needs: [packages, app-tests]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: cd apps/relay && flutter build macos --debug

name: release
# Push a tag v<version> (matching apps/relay/pubspec.yaml and relayVersion)
# to build, sign, notarize and publish. Each job skips itself when its
# secrets aren't set (docs/release.md).
on:
  push:
    tags: ['v*']

jobs:
  macos:
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_SPARKLE: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "pair=$(tool/release/check_version.sh '${{ github.ref_name }}')" >> "$GITHUB_OUTPUT"
      - if: env.HAS_CERT != 'true'
        run: echo "::warning::No Developer ID secrets; building unsigned only."
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: cd apps/relay && flutter build macos --release
      - name: Sign, notarize, staple
        if: env.HAS_CERT == 'true'
        working-directory: apps/relay
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ../../tool/release/macos_sign_notarize.sh
      - name: Appcast
        if: env.HAS_CERT == 'true' && env.HAS_SPARKLE == 'true'
        working-directory: apps/relay
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL || format('https://github.com/{0}/releases/download', github.repository) }}
        run: |
          set -- ${{ steps.v.outputs.pair }}
          ../../tool/release/macos_appcast.sh Relay-macos.dmg "$1" "$2"
      - name: Unsigned zip (no Developer ID yet)
        if: env.HAS_CERT != 'true'
        working-directory: apps/relay/build/macos/Build/Products/Release
        run: ditto -c -k --keepParent Relay.app "$GITHUB_WORKSPACE/apps/relay/Relay-macos-unsigned.zip"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/relay
          files=()
          for f in Relay-macos.dmg appcast.xml Relay-macos-unsigned.zip; do [[ -f $f ]] && files+=("$f"); done
          gh release upload '${{ github.ref_name }}' "${files[@]}" --clobber || gh release create '${{ github.ref_name }}' "${files[@]}" --title "Relay ${{ github.ref_name }}" --generate-notes

  ios:
    runs-on: macos-15
    env:
      HAS_IOS: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: tool/release/check_version.sh '${{ github.ref_name }}'
      - if: env.HAS_IOS != 'true'
        run: echo "::warning::No App Store secrets; skipping TestFlight."
      - uses: subosito/flutter-action@v2
        if: env.HAS_IOS == 'true'
        with:
          channel: stable
      - if: env.HAS_IOS == 'true'
        run: flutter pub get && cd apps/relay && flutter build ios --release --config-only
      - name: TestFlight
        if: env.HAS_IOS == 'true'
        working-directory: apps/relay
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: ../../tool/release/ios_testflight.sh

  # M10: Windows installer + portable zip, Linux AppImage + tarball. Not
  # code-signed yet (a Windows signing certificate is the owner's call).
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "pair=$(tool/release/check_version.sh '${{ github.ref_name }}')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: sqlite3.dll for relayd (pinned, checked)
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.sqlite.org/2025/sqlite-dll-win-x64-3500400.zip -OutFile sqlite.zip
          $hash = (Get-FileHash sqlite.zip -Algorithm SHA256).Hash
          if ($hash -ne '56B8751CDBF6DCD8AC9A35508039E456692A402BC5DDF576C2B0EDDB0FED8536') { throw "hash mismatch: $hash" }
          New-Item -ItemType Directory -Force tool/out | Out-Null
          Expand-Archive sqlite.zip -DestinationPath tool/out -Force
      - run: flutter pub get && tool/build_relay_helper.sh tool/out
      - run: cd apps/relay && flutter build windows --release
      - name: Installer and zip
        run: |
          set -- ${{ steps.v.outputs.pair }}
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=$1" tool/release/windows_installer.iss
          (cd apps/relay/build/windows/x64/runner/Release && 7z a -tzip ../../../../../../../relay-windows-x64.zip .)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.ref_name }}' tool/release/relay-windows-x64-setup.exe relay-windows-x64.zip --clobber || gh release create '${{ github.ref_name }}' tool/release/relay-windows-x64-setup.exe relay-windows-x64.zip --title "Relay ${{ github.ref_name }}" --generate-notes

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: tool/release/check_version.sh '${{ github.ref_name }}'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev libstdc++-12-dev zsync
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get && tool/build_relay_helper.sh tool/out
      - run: cd apps/relay && flutter build linux --release
      - name: AppImage and tarball
        working-directory: apps/relay
        run: |
          ../../tool/release/linux_appimage.sh
          tar -C build/linux/x64/release -czf relay-linux-x64.tar.gz bundle
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/relay
        run: |
          files=(relay-linux-x64.AppImage relay-linux-x64.AppImage.zsync relay-linux-x64.tar.gz)
          gh release upload '${{ github.ref_name }}' "${files[@]}" --clobber || gh release create '${{ github.ref_name }}' "${files[@]}" --title "Relay ${{ github.ref_name }}" --generate-notes

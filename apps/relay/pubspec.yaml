name: relay
description: "Relay desktop and iPhone app (Flutter UI). Talks to relayd over a local socket."
publish_to: 'none'
version: 0.2.0+4
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  lucide_icons_flutter: ^3.1.0
  markdown: ^7.3.0
  mobile_scanner: ^7.4.2
  path: ^1.9.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  relay_core: ^0.1.0
  relay_daemon: ^0.1.0
  relay_protocol: ^0.1.0
  sqlite3_flutter_libs: ^0.5.42
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
